<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:1200px;margin:0 auto;padding:24px;background:linear-gradient(145deg,#fff8f1,#f3e7df);color:#352b29}
h1,h2{text-align:center;color:#713e3e}
h1{font-family:Arial,Helvetica,sans-serif;line-height:1.4}
h2{margin-top:32px;padding-bottom:10px;border-bottom:2px solid #e6c6b3}
body>p a{display:inline-block;padding:10px 15px;border-radius:999px;background:#784b43;color:#fff;text-decoration:none}
body>p a:hover{background:#b65c62}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:18px}
figure{margin:0;background:#fff;padding:9px;border:1px solid #efd9cb;border-radius:12px;box-shadow:0 6px 18px #653c3012;transition:transform .2s,box-shadow .2s}
figure:hover{transform:translateY(-3px);box-shadow:0 12px 24px #653c3022}
img{width:100%;display:block;border-radius:7px}figcaption{text-align:center;font-size:14px;padding:10px 4px 2px;color:#754e43}
@media(max-width:500px){body{padding:16px}.grid{grid-template-columns:1fr}}
</style>
</head>

<head>
  <meta charset="utf-8">

  <title>Học web chuẩn</title>
  <style>
      *{box-sizing:border-box}
    body{margin:0;padding:20px 16px;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#fff8f1,#f3e7df);color:#352b29}
    .portfolio{width:min(960px,100%);margin:20px auto;background:#fff;border:1px solid #efd9cb;border-radius:20px;text-align:center;padding:28px 16px 24px;box-shadow:0 16px 40px #653c3016}
    h2{font-size:18px;letter-spacing:2px;margin:10px 0 0;color:#713e3e}
    h2:after{content:"";display:block;width:48px;height:3px;background:#b65c62;margin:10px auto 20px;border-radius:3px}
    ul{list-style:none;margin:0;padding:0}
    .list-tab{margin-bottom:20px}
    .list-tab li{display:inline-block;margin:0 8px}
    .list-tab a{font-size:9px;color:#444;text-decoration:none}
    .list-tab li:first-child a{color:#b65c62;font-weight:bold}
    .list-tab a:hover{color:#b65c62}
    .galerry li{display:inline-block;width:min(300px,100%);margin:0 7px 14px;vertical-align:top;overflow:hidden;border:1px solid #efd9cb;border-radius:12px;box-shadow:0 5px 14px #653c3012;transition:transform .2s}
    .galerry li:hover{transform:translateY(-3px)}
    .galerry img{display:block;width:100%;background:#e8cdbb}
    @media(max-width:500px){body{padding:10px}.list-tab li{margin:5px}.galerry{padding:0}.galerry li{width:calc(100% - 14px)}}
  </style>
</head>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khoa CNTTKD</title>
  <style>
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#352b29;background:linear-gradient(145deg,#fff8f1,#f3e7df)}
    .best-shared{max-width:980px;margin:60px auto;padding:54px 30px;border:1px solid #efd9cb;border-radius:22px;background:#fff;text-align:center;box-shadow:0 18px 45px #653c3018}
    .logo{margin:0 0 30px}
    .logo img{display:block;width:200px;max-width:100%;height:auto;margin:0 auto}
    h2{font-size:clamp(30px,5vw,42px);font-weight:normal;margin:0 0 20px;color:#713e3e}
    h2 strong{font-weight:normal;color:#b65c62}
    .lead-text{font-size:15px;line-height:1.7;color:#755e56;margin:0 0 40px}
    .btn-list{list-style:none;margin:0;padding:0}
    .btn-list li{display:inline-block;margin:0 8px}
    .btn-list a{display:inline-block;text-decoration:none;color:#fff;background:#784b43;
      font-size:14px;font-weight:bold;padding:16px 0;width:140px;border-radius:999px;transition:transform .2s,background .2s}
    .btn-list a:hover{background:#b65c62;transform:translateY(-3px)}
    @media(max-width:600px){.best-shared{margin:24px 14px;padding:38px 18px}.btn-list li{margin:6px}}
  </style>
</head>
<body>
  <section class="best-shared">
    <p class="logo"><img src="img/bitlogo.png" alt="Logo BIT - Khoa Công nghệ thông tin kinh doanh UEH"></p>
    <h2>Best <strong>Shared Hosting</strong> Company</h2>
    <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
    <ul class="btn-list">
      <li><a href="./">View Plans</a></li>
      <li><a href="./">All Features</a></li>
    </ul>
  </section>
</body>
</html>

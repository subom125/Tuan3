<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bài tập 7 - Layout wrapper</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px 20px;
        background: linear-gradient(145deg, #fff8f1, #f3e7df);
        color: #352b29;
      }
      body > p {
        max-width: 620px;
        margin: 0 auto 30px;
      }
      body > p a {
        display: inline-block;
        padding: 10px 15px;
        border-radius: 999px;
        background: #784b43;
        color: #fff;
        text-decoration: none;
      }
      body > p a:hover {
        background: #b65c62;
      }
      #wrapper {
        width: min(480px, 100%);
        height: 420px;
        margin: 0 auto;
        border: 3px solid #784b43;
        border-radius: 14px;
        padding: 10px;
        background: #fff8f1;
        box-shadow: 12px 12px 24px #653c3028;
        position: relative;
      }
      #wrapper:before {
        content: "wrapper";
        position: absolute;
        top: -27px;
        left: 0;
        font-size: 18px;
        font-weight: bold;
        color: #713e3e;
      }
      header,
      nav,
      main,
      footer {
        border: 2px solid #c47a6b;
        border-radius: 8px;
        padding: 8px;
        font-size: 18px;
        color: #633f37;
      }
      header {
        height: 50px;
        margin-bottom: 8px;
        background: #f4d8c8;
      }
      nav {
        float: left;
        width: 20%;
        height: 290px;
        background: #efd4d0;
      }
      main {
        float: right;
        width: 77%;
        height: 290px;
        background: #fff;
      }
      footer {
        clear: both;
        height: 38px;
        margin-top: 8px;
        position: relative;
        top: 0;
        background: #e8c49f;
      }
      #wrapper:after {
        content: "";
        display: block;
        clear: both;
      }
      @media (max-width: 520px) {
        body {
          padding: 36px 14px;
        }
        #wrapper {
          height: 390px;
        }
        nav,
        main {
          height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <p><a href="index.html">← Về trang chủ</a></p>
    <div id="wrapper">
      <header>header</header>
      <nav>nav</nav>
      <main>main</main>
      <footer>footer</footer>
    </div>
  </body>
</html>

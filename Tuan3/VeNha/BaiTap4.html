<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập 4 - Menu ngang</title>
<style>
body{min-height:100vh;margin:0;padding:40px 20px;font-family:Arial,sans-serif;color:#352b29;background:linear-gradient(145deg,#fff8f1,#f3e7df)}
body>p{max-width:760px;margin:0 auto}
body>p a{display:inline-block;padding:10px 15px;border-radius:999px;background:#784b43;color:#fff;text-decoration:none}
body>p a:hover{background:#b65c62}
ul{max-width:760px;list-style:none;margin:28px auto;padding:24px;border:1px solid #efd9cb;border-radius:18px;background:#fff;box-shadow:0 12px 30px #653c3016}
li{display:inline-block;width:120px;margin:6px 8px 6px 0;border-radius:9px;background:linear-gradient(135deg,#d98772,#b65c62);text-align:center;padding:12px 0;box-shadow:0 4px 10px #9a514333;transition:transform .2s,background .2s}
li:hover{transform:translateY(-3px);background:linear-gradient(135deg,#bd7650,#8e4d44)}
li a{display:block;color:#fff;font-weight:bold;text-decoration:none}
@media(max-width:480px){body{padding:24px 14px}ul{padding:18px 12px}li{width:calc(50% - 14px);margin-right:8px}}
</style>
</head>

</html>

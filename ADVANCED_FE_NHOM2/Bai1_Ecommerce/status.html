<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WonderLab - Trạng thái đơn hàng</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/xzoom/1.0.15/xzoom.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-star-rating@4.1.2/css/star-rating.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-default">
      <div class="container">
        <div class="navbar-header">
          <button
            class="navbar-toggle collapsed"
            data-toggle="collapse"
            data-target="#menu"
          >
            <span class="icon-bar"></span><span class="icon-bar"></span
            ><span class="icon-bar"></span></button
          ><a class="navbar-brand" href="index.html">🧸 WonderLab</a>
        </div>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="nav navbar-nav">
            <li><a href="index.html">Sản phẩm</a></li>
            <li><a href="product.html?id=robot">Chi tiết mẫu</a></li>
            <li><a href="status.html">Đơn hàng</a></li>
          </ul>
          <form class="navbar-form navbar-left" action="index.html">
            <div class="form-group">
              <input
                class="form-control"
                type="search"
                name="q"
                placeholder="Tìm đồ chơi..."
                aria-label="Tìm kiếm"
              />
            </div>
            <button class="btn btn-primary">Tìm</button>
          </form>
          <ul class="nav navbar-nav navbar-right">
            <li>
              <a href="status.html"
                ><span class="glyphicon glyphicon-shopping-cart"></span> Giỏ
                hàng <span class="badge cart-count">0</span></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container">
      <p><a class="btn btn-default" href="../index.html">Về hồ sơ</a></p>
      <h2>Giỏ hàng và trạng thái đơn hàng</h2>
      <p>Dữ liệu giỏ hàng được lưu trong trình duyệt bằng localStorage.</p>
      <div id="cart-items"></div>
      <h3 id="cart-total"></h3>
      <button class="btn btn-success" id="checkout">Đặt hàng (mô phỏng)</button>
      <button class="btn btn-default" id="clear-cart">Xóa giỏ</button>
      <hr />
      <h3>Lịch sử đơn hàng</h3>
      <div id="orders"></div>
    </main>
    <footer class="footer">
      WonderLab | Bài thực hành Advanced Front-end - Nhóm 2
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xzoom/1.0.15/xzoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-star-rating@4.1.2/js/star-rating.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
